<text x="186" y="239" class="node-title">登录入口</text>
<rect x="354" y="220" width="58" height="30" rx="15" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="383.0" y="240" text-anchor="middle" class="tag" fill="#2563eb">用户</text>
<text x="158" y="269" class="node-sub">进入生产系统，完成账号登录</text>
<rect x="510" y="205" width="300" height="58" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.6"/>
<circle cx="538" cy="235" r="16" fill="#2563eb"/>
<text x="538" y="240" text-anchor="middle" class="node-index">2</text>
<text x="566" y="239" class="node-title">仪表盘总览</text>
<rect x="734" y="220" width="58" height="30" rx="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="763.0" y="240" text-anchor="middle" class="tag" fill="#2563eb">入口</text>
<text x="538" y="269" class="node-sub">查看战略文档、构建状态与日更状态</text>
<rect x="890" y="205" width="300" height="58" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.6"/>
<circle cx="918" cy="235" r="16" fill="#ea580c"/>
<text x="918" y="240" text-anchor="middle" class="node-index">3</text>
<text x="946" y="239" class="node-title">选择工作路径</text>
<rect x="1114" y="220" width="58" height="30" rx="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="1143.0" y="240" text-anchor="middle" class="tag" fill="#ea580c">判断</text>
<text x="918" y="269" class="node-sub">新建构建或进入日常动态更新</text>
<rect x="1270" y="205" width="300" height="58" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.6"/>
<circle cx="1298" cy="235" r="16" fill="#0f766e"/>
<text x="1298" y="240" text-anchor="middle" class="node-index">4</text>
<text x="1326" y="239" class="node-title">进入文档空间</text>
<rect x="1494" y="220" width="58" height="30" rx="15" fill="#ffffff" stroke="#99f6e4" stroke-width="1.2"/>
<text x="1523.0" y="240" text-anchor="middle" class="tag" fill="#0f766e">空间</text>
<text x="1298" y="269" class="node-sub">围绕项目集战略文档持续工作</text>
<line x1="430" y1="234" x2="500" y2="234" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="810" y1="234" x2="880" y2="234" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="1190" y1="234" x2="1260" y2="234" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="70" y="326" width="820" height="650" rx="20" fill="#f8fbff" stroke="#e5e7eb" stroke-width="1.5"/>
<rect x="70" y="326" width="8" height="650" rx="4" fill="#2563eb"/>
<text x="98" y="368" class="lane-title">路径 A：从 0 到 1 构建</text>
<text x="98" y="394" class="lane-sub">适用于新项目集战略文档首次进入系统，从源材料逐步形成正式版本。</text>
<rect x="910" y="326" width="820" height="650" rx="20" fill="#fbfffc" stroke="#e5e7eb" stroke-width="1.5"/>
<rect x="910" y="326" width="8" height="650" rx="4" fill="#16a34a"/>
<text x="938" y="368" class="lane-title">路径 B：日常动态更新</text>
<text x="938" y="394" class="lane-sub">适用于已启用日更的战略文档，把新会议与外部信息转成可审阅的变更建议。</text>
<path d="M1040 280 C1040 305 520 302 520 326" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M1040 280 C1040 305 1320 302 1320 326" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="105" y="420" width="350" height="112" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<circle cx="133" cy="450" r="16" fill="#2563eb"/>
<text x="133" y="455" text-anchor="middle" class="node-index">A1</text>
<text x="161" y="454" class="node-title">上传材料并开始构建</text>
<rect x="363" y="435" width="74" height="30" rx="15" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="400.0" y="455" text-anchor="middle" class="tag" fill="#2563eb">用户操作</text>
<text x="133" y="484" class="node-sub">上传会议纪要、战略材料、项目背景。</text>
<text x="133" y="506" class="node-sub">系统创建 Build Session 并进入后台队列。</text>
<rect x="500" y="420" width="350" height="112" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<circle cx="528" cy="450" r="16" fill="#2563eb"/>
<text x="528" y="455" text-anchor="middle" class="node-index">A2</text>
<text x="556" y="454" class="node-title">AI 解析并生成方向</text>
<rect x="758" y="435" width="74" height="30" rx="15" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="795.0" y="455" text-anchor="middle" class="tag" fill="#2563eb">系统自动</text>
<text x="528" y="484" class="node-sub">文件解析、内容理解、生成战略方向草案。</text>
<text x="528" y="506" class="node-sub">页面展示进度，失败可重试。</text>
<rect x="105" y="570" width="350" height="112" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<circle cx="133" cy="600" r="16" fill="#ea580c"/>
<text x="133" y="605" text-anchor="middle" class="node-index">A3</text>
<text x="161" y="604" class="node-title">确认方向并排序</text>
<rect x="363" y="585" width="74" height="30" rx="15" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
<text x="400.0" y="605" text-anchor="middle" class="tag" fill="#ea580c">用户判断</text>
<text x="133" y="634" class="node-sub">逐条通过、不通过或需调整。</text>
<text x="133" y="656" class="node-sub">全部处理后拖拽排序并确认。</text>
<rect x="500" y="570" width="350" height="112" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<circle cx="528" cy="600" r="16" fill="#2563eb"/>
<text x="528" y="605" text-anchor="middle" class="node-index">A4</text>
<text x="556" y="604" class="node-title">生成维度与观点</text>
<rect x="744" y="585" width="88" height="30" rx="15" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="788.0" y="605" text-anchor="middle" class="tag" fill="#2563eb">AI 生成</text>
<text x="528" y="634" class="node-sub">方向确认后生成维度；维度确认后生成观点。</text>
<text x="528" y="656" class="node-sub">需调整会触发局部重新生成。</text>
<rect x="105" y="720" width="350" height="112" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<circle cx="133" cy="750" r="16" fill="#ea580c"/>
<text x="133" y="755" text-anchor="middle" class="node-index">A5</text>
<text x="161" y="754" class="node-title">逐层确认结构</text>
<rect x="363" y="735" width="74" height="30" rx="15" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
<text x="400.0" y="755" text-anchor="middle" class="tag" fill="#ea580c">用户判断</text>
<text x="133" y="784" class="node-sub">按方向、维度、观点逐层审阅。</text>
<text x="133" y="806" class="node-sub">用户决定保留、拒绝或调整。</text>
<rect x="500" y="720" width="350" height="112" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.6"/>
<circle cx="528" cy="750" r="16" fill="#9333ea"/>
<text x="528" y="755" text-anchor="middle" class="node-index">A6</text>
<text x="556" y="754" class="node-title">专家评审与最终发布</text>
<rect x="774" y="735" width="58" height="30" rx="15" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
<text x="803.0" y="755" text-anchor="middle" class="tag" fill="#9333ea">闭环</text>
<text x="528" y="784" class="node-sub">识别领域、创建专家、讨论、生成报告。</text>
<text x="528" y="806" class="node-sub">最终审阅后发布为正式战略文档。</text>
