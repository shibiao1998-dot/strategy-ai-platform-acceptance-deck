<text x="128" y="914" class="node-sub"><tspan font-weight="700" fill="#111827">关键控制点：</tspan>方向、维度、观点都必须由人确认后继续推进。</text>
<rect x="1340" y="885" width="350" height="58" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="1363" y="914" class="node-sub"><tspan font-weight="700" fill="#111827">验收口径：</tspan>建议清单审完并提交，才会回写成新版本。</text>
