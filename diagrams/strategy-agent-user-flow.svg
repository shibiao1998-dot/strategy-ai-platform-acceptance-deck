<text x="973" y="455" text-anchor="middle" class="node-index">B1</text>
<text x="1001" y="454" class="node-title">触发日常更新</text>
<rect x="1189" y="435" width="88" height="30" rx="15" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="1233.0" y="455" text-anchor="middle" class="tag" fill="#16a34a">用户/定时</text>
<text x="973" y="484" class="node-sub">用户选择日期手动触发；也可由定时任务触发。</text>
<text x="973" y="506" class="node-sub">系统创建 Daily Update Job。</text>
<rect x="1340" y="420" width="350" height="112" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
<circle cx="1368" cy="450" r="16" fill="#16a34a"/>
<text x="1368" y="455" text-anchor="middle" class="node-index">B2</text>
<text x="1396" y="454" class="node-title">抓取新会议与外部信息</text>
<rect x="1598" y="435" width="74" height="30" rx="15" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="1635.0" y="455" text-anchor="middle" class="tag" fill="#16a34a">系统自动</text>
<text x="1368" y="484" class="node-sub">抓取会议纪要，按启用日更的文档展开分析。</text>
<text x="1368" y="506" class="node-sub">必要时补充外部行业资讯。</text>
<rect x="945" y="570" width="350" height="112" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
<circle cx="973" cy="600" r="16" fill="#16a34a"/>
<text x="973" y="605" text-anchor="middle" class="node-index">B3</text>
<text x="1001" y="604" class="node-title">分析影响范围</text>
<rect x="1189" y="585" width="88" height="30" rx="15" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="1233.0" y="605" text-anchor="middle" class="tag" fill="#16a34a">AI 分析</text>
<text x="973" y="634" class="node-sub">逐篇会议 x 逐份文档判断相关性。</text>
<text x="973" y="656" class="node-sub">输出新增、修改、删除等影响摘要。</text>
<rect x="1340" y="570" width="350" height="112" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
<circle cx="1368" cy="600" r="16" fill="#16a34a"/>
<text x="1368" y="605" text-anchor="middle" class="node-index">B4</text>
<text x="1396" y="604" class="node-title">合并变更建议</text>
<rect x="1584" y="585" width="88" height="30" rx="15" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="1628.0" y="605" text-anchor="middle" class="tag" fill="#16a34a">AI 合并</text>
<text x="1368" y="634" class="node-sub">把多条分析归并为每份文档的建议清单。</text>
<text x="1368" y="656" class="node-sub">生成可追溯的 Merged Proposal。</text>
<rect x="945" y="720" width="350" height="112" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<circle cx="973" cy="750" r="16" fill="#ea580c"/>
<text x="973" y="755" text-anchor="middle" class="node-index">B5</text>
<text x="1001" y="754" class="node-title">逐条审阅建议</text>
<rect x="1203" y="735" width="74" height="30" rx="15" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
<text x="1240.0" y="755" text-anchor="middle" class="tag" fill="#ea580c">用户判断</text>
<text x="973" y="784" class="node-sub">按方向分组查看，逐条采纳、拒绝或调整。</text>
<text x="973" y="806" class="node-sub">未完成审阅前不回写正式文档。</text>
<rect x="1340" y="720" width="350" height="112" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.6"/>
<circle cx="1368" cy="750" r="16" fill="#9333ea"/>
<text x="1368" y="755" text-anchor="middle" class="node-index">B6</text>
<text x="1396" y="754" class="node-title">提交并形成新版本</text>
<rect x="1614" y="735" width="58" height="30" rx="15" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
<text x="1643.0" y="755" text-anchor="middle" class="tag" fill="#9333ea">回写</text>
<text x="1368" y="784" class="node-sub">采纳项写入文档结构并创建版本。</text>
<text x="1368" y="806" class="node-sub">可触发或进入专家复核，通知相关负责人。</text>
