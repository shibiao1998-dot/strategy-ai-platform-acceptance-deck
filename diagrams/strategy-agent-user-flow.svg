<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1180" width="1800" height="1180">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .title { font-size: 34px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 15px; fill: #5f6f84; }
    .eyebrow { font-size: 12px; letter-spacing: 2px; font-weight: 700; fill: #5f6f84; }
    .lane-title { font-size: 24px; font-weight: 700; fill: #111827; }
    .lane-sub { font-size: 14px; fill: #5f6f84; }
    .node-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .node-sub { font-size: 13px; fill: #5f6f84; }
    .node-index { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .tag { font-size: 12px; font-weight: 700; }
    .legend { font-size: 13px; fill: #5f6f84; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,4.5 L0,9 Z" fill="#16a34a"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,4.5 L0,9 Z" fill="#ea580c"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,4.5 L0,9 Z" fill="#9333ea"/></marker>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
  </defs>
  <rect width="1800" height="1180" fill="#ffffff"/>

<rect x="44" y="36" width="1712" height="118" rx="18" fill="url(#header-grad)" stroke="#e5e7eb" stroke-width="1.4"/>
