<text x="78" y="116" class="title">顶层战略 Agent 用户使用流程结构图</text>
<text x="1180" y="82" class="subtitle">覆盖：从 0 到 1 构建 / 日常动态更新 / 人工验收闭环</text>
<text x="1180" y="112" class="subtitle">原则：AI 生成建议，人负责关键判断；所有输入与结论可追溯。</text>
