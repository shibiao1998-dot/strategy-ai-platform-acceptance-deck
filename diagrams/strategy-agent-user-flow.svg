<rect x="360" y="1010" width="1080" height="104" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="390" y="1050" class="lane-title">共同产出：可追溯战略文档与下游管理信号</text>
<text x="390" y="1078" class="lane-sub">战略文档库、术语库、来源证据、通知与版本记录持续沉淀；后续可把战略变化传递给意图识别与分发 Agent，再进入 AI 项目管理闭环。</text>
<rect x="1180" y="1032" width="98" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="1229.0" y="1052" text-anchor="middle" class="tag" fill="#2563eb">文档版本</text>
